<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="container mt-5">
  <h2 class="mb-4 text-center">Nuevo Producto</h2>

  <form th:action="@{/products/create}" th:object="${productDto}" method="post" enctype="multipart/form-data" class="row g-3">

    <!-- Nombre -->
    <div class="col-md-6">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" th:field="*{nombre}" class="form-control" id="nombre" placeholder="Ej: Notebook Lenovo">
      <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
    </div>

    <!-- Marca -->
    <div class="col-md-6">
      <label for="marca" class="form-label">Marca</label>
      <input type="text" th:field="*{marca}" class="form-control" id="marca" placeholder="Ej: Lenovo">
      <div class="text-danger" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></div>
    </div>

    <!-- Categoría -->
    <div class="col-md-6">
      <label for="categoria" class="form-label">Categoría</label>
      <input type="text" th:field="*{categoria}" class="form-control" id="categoria" placeholder="Ej: Notebook">
      <div class="text-danger" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
    </div>

    <!-- Precio -->
    <div class="col-md-3">
      <label for="precio" class="form-label">Precio ($ ARS)</label>
      <input type="number" step="0.01" th:field="*{precio}" class="form-control" id="precio" placeholder="Ej: 199999.99">
      <div class="text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
    </div>

    <!-- Stock -->
    <div class="col-md-3">
      <label for="stock" class="form-label">Stock</label>
      <input type="number" th:field="*{stock}" class="form-control" id="stock" placeholder="Ej: 50">
      <div class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
    </div>

    <!-- Descripción -->
    <div class="col-12">
      <label for="description" class="form-label">Descripción</label>
      <textarea th:field="*{description}" class="form-control" id="description" rows="4" placeholder="Breve descripción del producto..."></textarea>
      <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    </div>

    <!-- Imagen -->
    <div class="col-12">
      <label for="imageFile" class="form-label">Imagen del producto</label>
      <input type="file" th:field="*{imageFile}" class="form-control" id="imageFile" onchange="previewImage(event)">
      <div class="text-danger" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></div>
      <div class="mt-3">
        <img id="imagePreview" src="#" alt="Vista previa" style="display:none; max-width: 200px;" class="img-thumbnail">
      </div>
    </div>

    <!-- Botones -->
    <div class="col-12 text-center">
      <button type="submit" class="btn btn-success me-2">Guardar</button>
      <a href="/products" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function previewImage(event) {
    const image = document.getElementById('imagePreview');
    image.src = URL.createObjectURL(event.target.files[0]);
    image.style.display = 'block';
  }
</script>
</body>
</html>
