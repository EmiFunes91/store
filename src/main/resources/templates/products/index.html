<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
  <h1 class="text-center mb-4">Gestión de Productos</h1>

  <div class="d-flex justify-content-end mb-3">
    <a class="btn btn-success" href="/products/create">
      <i class="bi bi-plus-circle"></i> Crear Producto
    </a>
  </div>

  <!-- Buscador de productos -->
  <form class="row mb-4 align-items-center" th:action="@{/products}" method="get">
    <div class="col-md-8">
      <input type="text" name="keyword" class="form-control" placeholder="Buscar por marca o categoría..." th:value="${keyword}">
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-search"></i> Buscar
      </button>
    </div>
    <div class="col-md-2">
      <a href="/products" class="btn btn-outline-secondary w-100">
        <i class="bi bi-x-circle"></i> Limpiar
      </a>
    </div>
  </form>


  <div class="table-responsive">
    <table class="table table-bordered align-middle text-center">
      <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Marca</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Estado</th>
        <th>Imagen</th>
        <th>Fecha</th>
        <th>Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="product : ${products}">
        <td th:text="${product.id}">1</td>
        <td th:text="${product.nombre}">Producto</td>
        <td th:text="${product.marca}">Marca</td>
        <td th:text="${product.categoria}">Categoría</td>
        <td th:text="${#numbers.formatDecimal(product.precio, 1, 'COMMA', 2, 'POINT')} + ' $'">0,00 $</td>
        <td th:text="${product.stock}">0</td>

        <td>
          <span class="badge bg-success" th:if="${product.activo == true}">Activo</span>
          <span class="badge bg-secondary" th:if="${product.activo == false}">Inactivo</span>
        </td>

        <td>
          <img th:src="@{'/images/' + ${product.nombreImagen}}" alt="Imagen" class="img-thumbnail" style="width: 100px;">
        </td>

        <td th:text="${#dates.format(product.createAt, 'yyyy-MM-dd')}">Sin fecha</td>

        <!-- Acciones -->
        <td class="align-middle">
          <div class="d-flex justify-content-center flex-wrap gap-1">
            <!-- Editar -->
            <a class="btn btn-warning btn-sm" th:href="@{/products/edit(id=${product.id})}" title="Editar">
              <i class="bi bi-pencil-square"></i>
            </a>

            <!-- Eliminar -->
            <a class="btn btn-danger btn-sm" th:href="@{/products/delete(id=${product.id})}" title="Eliminar"
               onclick="return confirm('¿Estás seguro de eliminar este producto?')">
              <i class="bi bi-trash3-fill"></i>
            </a>

            <!-- Activar/Inactivar -->
            <a th:href="@{/products/toggle(id=${product.id})}"
               th:class="'btn btn-sm ' + (${product.activo} ? 'btn-outline-secondary' : 'btn-outline-success')"
               th:title="${product.activo} ? 'Inactivar' : 'Activar'">
              <i th:class="${product.activo} ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </a>
          </div>
        </td>

      </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
